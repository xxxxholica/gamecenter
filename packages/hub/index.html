<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GAME CENTER</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #07060c;
      color: #fff;
      font-family: 'Impact', 'Arial Black', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 56px 24px 64px;

      /* 星空 + 淡いネオングロー */
      background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5) 100%, transparent),
        radial-gradient(1.5px 1.5px at 120px 90px, rgba(255,255,255,0.35) 100%, transparent),
        radial-gradient(1px 1px at 200px 40px, rgba(255,255,255,0.4) 100%, transparent),
        radial-gradient(1.5px 1.5px at 300px 140px, rgba(255,255,255,0.3) 100%, transparent),
        radial-gradient(1px 1px at 60px 180px, rgba(255,255,255,0.4) 100%, transparent),
        radial-gradient(1.5px 1.5px at 340px 220px, rgba(255,255,255,0.3) 100%, transparent),
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 177, 0, 0.14), transparent 60%),
        radial-gradient(ellipse 700px 400px at 100% 20%, rgba(255, 43, 77, 0.1), transparent 60%);
      background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
      background-size: 360px 240px, 360px 240px, 360px 240px, 360px 240px, 360px 240px, 360px 240px, auto, auto;
    }

    /* CRT走査線オーバーレイ(ゲーム本編のscanlinesと揃えたトーン) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 2px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: multiply;
      opacity: 0.5;
    }

    #hero,
    #game-list {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
    }

    #hero {
      margin-bottom: 32px;
    }

    /* ===== ピックアップ・カルーセル ===== */
    .hero-viewport {
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .hero-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .hero-slide {
      position: relative;
      flex: 0 0 100%;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      min-height: 420px;
      background: linear-gradient(180deg, #1c1c26, #131319);
      border: 1px solid #2c2c3a;
    }

    /* カード全体をクリック領域にしつつ、デベロッパー表記だけ独立したリンクにする透明オーバーレイ */
    .hero-link {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-dev {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      text-decoration: none;
    }

    .hero-dev-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .hero-dev-name {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: #8f8fa5;
      text-transform: none;
    }

    .hero-dev:hover .hero-dev-name {
      color: #fff;
      text-decoration: underline;
    }

    .hero-screen {
      position: relative;
      background: #000;
    }

    /* 説明文の長さで隣の列(hero-info)が伸びた分だけ、画像側もそれに合わせて伸縮させる。
       (絶対配置にすることでグリッド行の自動サイズ計算から画像を切り離し、
       hero-infoの高さに追従させている) */
    .hero-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.95) brightness(0.95);
      transition: filter 0.18s ease;
    }

    body:not(.pad-mode) .hero-slide:hover .hero-thumb {
      filter: saturate(1.08) brightness(1.03);
    }

    .hero-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.2) 0px,
        rgba(0, 0, 0, 0.2) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 48px 52px;
    }

    .hero-title-en {
      font-size: clamp(2rem, 3.8vw, 2.8rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.5),
        0 0 18px color-mix(in srgb, var(--accent) 80%, transparent),
        0 0 40px color-mix(in srgb, var(--accent) 45%, transparent);
      line-height: 1.15;
    }

    .hero-title-ja {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.03em;
      color: #c9c9d8;
    }

    .hero-desc {
      margin-top: 1px;
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 1rem;
      line-height: 1.8;
      color: #9a9ab0;
      text-transform: none;
    }

    @media (max-width: 720px) {
      .hero-slide {
        grid-template-columns: 1fr;
      }

      /* 画像とhero-infoが縦積みになり、隣の列の高さに追従させる手が使えないため固定高にする */
      .hero-screen {
        height: 260px;
      }
    }

    .hero-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .hero-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: none;
      background: #2c2c3a;
      cursor: pointer;
      padding: 0;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .hero-dot:hover {
      background: #4a4a5e;
    }

    .hero-dot.active {
      background: #fff;
      transform: scale(1.2);
    }

    /* ===== ゲーム一覧 ===== */
    #game-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .card {
      --accent: #ff2fd4;
      position: relative;
      display: block;
      background: linear-gradient(180deg, #1c1c26, #131319);
      border: 1px solid #2c2c3a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    /* カード全体をクリック領域にしつつ、デベロッパー表記だけ独立したリンクにする透明オーバーレイ */
    .card-link {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* マウスではhover、アケコン/キー操作中(pad-mode)は選択中のカードを同じ見た目で光らせる */
    body:not(.pad-mode) .card:hover,
    body.pad-mode .card.selected {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--accent),
        0 0 26px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .card-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      filter: saturate(0.92) brightness(0.94);
      transition: filter 0.18s ease;
    }

    body:not(.pad-mode) .card:hover .card-thumb,
    body.pad-mode .card.selected .card-thumb {
      filter: saturate(1.05) brightness(1.02);
    }

    .card-body {
      padding: 16px 20px 22px;
    }

    .card-title-en {
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: #d6d6e2;
      margin-bottom: 2px;
    }

    .card h2 {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .card-dev {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .card-dev-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .card-dev-name {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      text-transform: none;
      font-size: 0.76rem;
      color: #8f8fa5;
    }

    .card-dev:hover .card-dev-name {
      color: #fff;
      text-decoration: underline;
    }

    .card-desc {
      font-family: system-ui, sans-serif;
      text-transform: none;
      color: #9a9ab0;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    /* ===== アケコン操作 ===== */
    body.pad-mode,
    body.pad-mode * {
      cursor: none;
    }

    /* 決定ボタンを押している間の押し込み演出(離した瞬間にゲームへ遷移する) */
    body.pad-mode .card.pressed {
      transform: translateY(-2px) scale(0.98);
    }

    .hero-slide.pressed .hero-thumb {
      filter: saturate(1.15) brightness(1.25);
    }
  </style>
</head>
<body>
  <div id="hero">
    <div class="hero-viewport">
      <div class="hero-track" id="hero-track"></div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </div>
  <div id="game-list"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
