<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ゲームセンター｜GAME CENTER</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" href="./favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #07060c;
      color: #fff;
      font-family: 'Impact', 'Arial Black', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 56px 24px 64px;

      /* 星空 + 淡いネオングロー */
      background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5) 100%, transparent),
        radial-gradient(1.5px 1.5px at 120px 90px, rgba(255,255,255,0.35) 100%, transparent),
        radial-gradient(1px 1px at 200px 40px, rgba(255,255,255,0.4) 100%, transparent),
        radial-gradient(1.5px 1.5px at 300px 140px, rgba(255,255,255,0.3) 100%, transparent),
        radial-gradient(1px 1px at 60px 180px, rgba(255,255,255,0.4) 100%, transparent),
        radial-gradient(1.5px 1.5px at 340px 220px, rgba(255,255,255,0.3) 100%, transparent),
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 177, 0, 0.14), transparent 60%),
        radial-gradient(ellipse 700px 400px at 100% 20%, rgba(255, 43, 77, 0.1), transparent 60%);
      background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
      background-size: 360px 240px, 360px 240px, 360px 240px, 360px 240px, 360px 240px, 360px 240px, auto, auto;
    }

    /* CRT走査線オーバーレイ(ゲーム本編のscanlinesと揃えたトーン) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 2px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: multiply;
      opacity: 0.5;
    }

    /* ===== ゲーム一覧 ===== */
    #game-list {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px;
    }

    .card {
      --accent: #ff2fd4;
      position: relative;
      display: block;
      background: linear-gradient(180deg, #1c1c26, #131319);
      border: 1px solid #2c2c3a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    /* カード全体をクリック領域にしつつ、デベロッパー表記だけ独立したリンクにする透明オーバーレイ */
    .card-link {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* マウスではhover、アケコン/キー操作中(pad-mode)は選択中のカードを同じ見た目で光らせる */
    body:not(.pad-mode) .card:hover,
    body.pad-mode .card.selected {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--accent),
        0 0 26px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .card-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      filter: saturate(0.92) brightness(0.94);
      transition: filter 0.18s ease;
    }

    body:not(.pad-mode) .card:hover .card-thumb,
    body.pad-mode .card.selected .card-thumb {
      filter: saturate(1.05) brightness(1.02);
    }

    .card-body {
      padding: 18px 20px 22px;
    }

    .card-logo-wrap {
      width: 50%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .card-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
      transform-origin: left center;
      transition: transform 0.18s ease;
    }

    body:not(.pad-mode) .card:hover .card-logo,
    body.pad-mode .card.selected .card-logo {
      transform: scale(1.04);
    }

    .card-title-en {
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: #d6d6e2;
      margin-bottom: 2px;
    }

    .card h2 {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .card-dev {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .card-dev-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .card-dev-name {
      font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
      text-transform: none;
      font-size: 0.76rem;
      color: #8f8fa5;
    }

    .card-dev:hover .card-dev-name {
      color: #fff;
      text-decoration: underline;
    }

    .card-desc {
      font-family: system-ui, sans-serif;
      text-transform: none;
      color: #9a9ab0;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    /* ===== アケコン操作 ===== */
    body.pad-mode,
    body.pad-mode * {
      cursor: none;
    }

    /* 決定ボタンを押している間の押し込み演出(離した瞬間にゲームへ遷移する) */
    body.pad-mode .card.pressed {
      transform: translateY(-2px) scale(0.98);
    }
  </style>
</head>
<body>
  <div id="game-list"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
