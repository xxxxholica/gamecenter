<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>サバイバー・スコアバトル SURVIVOR SCORE BATTLE</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" href="./favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070d;
        color: #fff;
        font-family: 'Hiragino Kaku Gothic StdN', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
      }

      #game-wrapper {
        position: fixed;
        inset: 0;
        background: #080c14;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

    /* 日本語の文字を太めのゴシックにそろえる */
    .agc-root, .agc-label, .ats-tagline, .ap-root, .ap-root *, .msel, .msel * {
      font-family: 'Hiragino Kaku Gothic StdN', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif !important;
    }
    .agc-label, .ats-tagline { font-weight: 800 !important; }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
