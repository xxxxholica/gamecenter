<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>サバイバー・スコアバトル｜SURVIVOR SCORE BATTLE</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" href="./favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070d;
        color: #fff;
        font-family: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 177.78vh; /* 16:9 ratio */
        max-height: 56.25vw; /* 16:9 ratio */
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080c14;
        box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: auto;
      }

      /* Arcade cabinet bezel effect */
      #game-wrapper::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 2px solid rgba(0, 255, 200, 0.3);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="1920" height="1080"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
