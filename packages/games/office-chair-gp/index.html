<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爆走！グラウンド事務椅子GP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Speedlines overlay canvas -->
  <canvas id="speedlines-canvas"></canvas>

  <!-- Lime powder whiteout overlay -->
  <div id="whiteout-overlay"></div>

  <!-- Mud splatter overlay -->
  <div id="mud-overlay"></div>



  <!-- 1990s ARCADE HUD -->
  <div id="hud">
    <!-- Top Left: POS & LAP (Vertical Stack) -->
    <div id="hud-top-left" class="arcade-hud-col top-left">
      <div id="hud-pos" class="arcade-hud-box">
        <span class="hud-label">POS</span>
        <span id="pos-display" class="hud-value pos-val">1<span class="pos-total">/4</span></span>
      </div>
      <div id="hud-lap" class="arcade-hud-box">
        <span class="hud-label">LAP</span>
        <span id="lap-display" class="hud-value">1/1</span>
      </div>
    </div>

    <!-- Top Right: TIME -->
    <div id="hud-time" class="arcade-hud-box top-right">
      <span class="hud-label">TIME</span>
      <span id="time-display" class="hud-value">00:00.00</span>
    </div>

    <!-- Bottom Left: BOMB & JET -->
    <div id="hud-bottom-left" class="arcade-hud-col bottom-left">
      <div id="hud-bomb" class="arcade-hud-box">
        <span class="hud-label-inline bomb-label">BOMB [ENTER]</span>
        <span id="bomb-status" class="bomb-ready">READY</span>
      </div>
      <div id="hud-jet" class="arcade-hud-box">
        <div class="hud-label-inline">JET</div>
        <div id="jet-meter" class="jet-blocks">
          <!-- 10 square blocks for arcade meter -->
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
          <div class="jet-block active"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Right: SPEED -->
    <div id="hud-speed" class="arcade-hud-box bottom-right">
      <span class="hud-label">SPEED</span>
      <div class="speed-num-row">
        <span id="speed-display" class="hud-value-large">0</span>
        <span class="hud-unit">km/h</span>
      </div>
    </div>

    <!-- Center Messages (READY, GO, REVERSE WARN) -->
    <div id="hud-center-announce" class="arcade-announce"></div>
  </div>

  <!-- Title / Start Screen -->
  <div id="title-screen" class="arcade-modal">
    <div class="arcade-title-box">
      <h1 class="arcade-title-main">爆走！グラウンド事務椅子GP</h1>
      <div class="arcade-title-sub">GROUND DRIFT RACER</div>
    </div>

    <div class="arcade-control-guide">
      <div class="guide-row"><span class="guide-key">A / D または 左右</span><span class="guide-action">土煙ドリフト ステアリング</span></div>
      <div class="guide-row"><span class="guide-key">SPACE または ボタン0</span><span class="guide-action">消火器ジェット 200km/h急加速</span></div>
      <div class="guide-row"><span class="guide-key">SHIFT または ボタン1</span><span class="guide-action">足ブレーキ 靴底摩擦ターン</span></div>
      <div class="guide-row"><span class="guide-key">ENTER または ボタン2</span><span class="guide-action">ボンベ投擲 前方妨害攻撃</span></div>
    </div>

    <button id="start-btn" class="arcade-btn">開始</button>
  </div>

  <!-- Game Over: 大破 -->
  <div id="crash-screen" class="arcade-modal hidden">
    <div class="crash-title">大破</div>
    <div class="crash-subtitle" id="crash-reason">朝礼台正面衝突</div>
    <button id="retry-crash-btn" class="arcade-btn">再挑戦</button>
  </div>

  <!-- Goal: 完走 & リザルト一体型画面 -->
  <div id="goal-screen" class="arcade-modal hidden">
    <div class="checker-strip top"></div>
    <div class="goal-banner">
      <div id="goal-title" class="goal-title">GOAL!! 完走</div>
      <div id="final-rank" class="goal-rank">1ST PLACE!</div>
      <div class="goal-time-label">RECORD TIME</div>
      <div id="final-time" class="goal-time">00:00.00</div>
    </div>
    <button id="retry-goal-btn" class="arcade-btn">再挑戦</button>
    <div class="checker-strip bottom"></div>
  </div>

  <!-- ホーム誘導ガイド(クリックでも遷移可能) -->
  <a id="home-guide" href="../../">ESC : ホームへ戻る</a>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
