<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極限ギリギリ選手権｜EXTREME GIRI-GIRI ARCADE</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" href="./favicon.ico" />
  <style>
    /* 1990-2000s Arcade Style: High Contrast, Sharp Edges, Impact Typography */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'Hiragino Kaku Gothic StdN', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* CRT Scanline Overlay */
    #scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* Black Fade Overlay for direct stage transitions */
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      opacity: 0;
      transition: opacity 0.3s linear;
      z-index: 50;
      pointer-events: none;
    }

    /* Container-less HUD: Direct typography over 3D screen */
    .hud-text {
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow:
        3px 3px 0 #000,
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        0 4px 0 #000,
        4px 0 0 #000;
      line-height: 1.15;
    }

    /* Top HUD bar: flex row so left/right blocks never overlap, each side
       claims at most 46% width and scales down with clamp() on narrow screens */
    #hud-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 20px;
      gap: 12px;
      pointer-events: none;
    }

    .hud-block {
      display: flex;
      flex-direction: column;
      max-width: 46%;
      min-width: 0;
    }

    .hud-block-right {
      align-items: flex-end;
      text-align: right;
    }

    .hud-label {
      font-size: clamp(12px, 2vw, 18px);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    #hud-round { color: #ffffff; }

    #hud-sub-info {
      color: #00e5ff;
      font-size: clamp(12px, 2.4vw, 22px);
      display: none;
      margin-top: 2px;
    }

    /* Danger Vignette: Screen-edge red pulse when approaching limit */
    #danger-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%,
        rgba(255, 26, 26, 0) 65%,
        rgba(255, 26, 26, 0.9) 100%
      );
    }

    /* Critical flash overlay */
    #danger-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9;
      pointer-events: none;
      background: rgba(255, 26, 26, 0.18);
      opacity: 0;
    }

    /* 下部中央に常時表示する操作ガイド([A] ドリンクを止める): グラグラタワーのアイテム案内と同じ、黒い半透明の帯 */
    #hud-action-guide {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 6%;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 32px;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border-radius: 0;
      font-size: 40px;
      font-weight: 800;
      white-space: nowrap;
      border: 3px solid transparent;
    }
    #hud-action-guide .agc-inline { display: inline-flex; align-items: center; gap: 6px; zoom: 1.8; }
    #hud-action-guide small { font-size: 40px; font-weight: 800; opacity: 0.95; }
    /* ギリギリが近づいたら、赤く点滅して焦らせる(点滅し出したら一定のテンポ) */
    #hud-action-guide.danger { animation: guideDanger 0.35s steps(1) infinite; }
    @keyframes guideDanger {
      0%   { background: rgba(255, 0, 0, 1); border-color: #ffffff; color: #ffffff; transform: translateX(-50%) scale(1.12); box-shadow: 0 0 40px 12px rgba(255, 0, 0, 0.9); }
      50%  { background: rgba(0, 0, 0, 0.7); border-color: #ff1a1a; color: #ff5555; transform: translateX(-50%) scale(1); box-shadow: none; }
    }

    /* 種目の始まり: 見出しを大きく出して、3・2・1のカウントダウン */
    /* カウントダウン中と、判定(成功・大惨事・パーセント)を出している間は、後ろの要素を暗く半透明で覆って薄くする。
       覆いは画面の大きさの層(body の ::after)にして、中央の帯(z-index 30)のすぐ下に置く。
       帯の ::before を画面の 9 倍(300vw x 300vh)に広げて覆っていたときは、Safari のフルスクリーンで、判定を出す瞬間と
       ページを切り替える瞬間に 33〜50ms のフレームが出ていた(計測: Safari 26・Mac・1920x1080、どの種目も判定の瞬間に 1 回)。
       帯は transform で中央に寄せているので、帯の中の position: fixed は画面ではなく帯が基準になる。そのため body に置く。
       帯は中身を残したまま style.display = 'none' で隠すので、隠れている間は覆わない(game.ts は display を必ず style で書く) */
    body:has(> #center-banner:not([style*="display: none"]) .intro-count)::after,
    body:has(> #center-banner:not([style*="display: none"]) .judgment-score)::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 29;
    }
    /* --dim はカウントダウンの経過に合わせて game.ts が body に 1→0 で書く。判定の間は薄くしない */
    body:has(> #center-banner:not([style*="display: none"]) .intro-count)::after { background: rgba(0, 0, 0, calc(0.82 * var(--dim, 1))); }
    body:has(> #center-banner:not([style*="display: none"]) .judgment-score)::after { background: rgba(0, 0, 0, 0.82); }
    .intro-headline { color: #ffffff; }
    /* 見出し(溢れる前に止めろ)・成功・大惨事・もう一度挑戦・パーセントは、すべて同じ文字サイズ・太さ・字間・影にそろえる */
    .intro-headline, .judgment-label, .judgment-retry, .judgment-score {
      font-size: min(100px, 9.5vw);
      font-weight: 900;
      letter-spacing: 4px;
      white-space: nowrap;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
    }
    .intro-count {
      margin-top: 8px;
      font-size: clamp(80px, 18vw, 200px);
      font-weight: 900;
      line-height: 1;
      color: #ffe600;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      animation: arcade-pulse 0.5s infinite alternate;
    }

    /* Center Staging Flash Banner */
    #center-banner {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      width: 100%;
    }

    .banner-title {
      font-size: 42px;
      color: #00ff66;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .banner-mission {
      font-size: 46px;
      color: #ffffff;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .banner-action {
      font-size: 58px;
      color: #ffe600;
      text-shadow: 5px 5px 0 #000, -5px -5px 0 #000, 5px -5px 0 #000, -5px 5px 0 #000;
      letter-spacing: 6px;
    }

    .pulse-text {
      animation: arcade-pulse 0.25s infinite alternate;
    }

    /* プレイ中に画面中央へ出し続けるヒント。1行目(主)を大きく、2行目以降(補足)を小さく、枠付きで強調する */
    .banner-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 1vw, 10px);
      padding: clamp(12px, 2vw, 20px) clamp(20px, 4vw, 44px);
      background: rgba(0, 0, 0, 0.72);
      border: 4px solid #ffe600;
      border-radius: 12px;
      box-shadow: 0 0 0 3px #000, 0 0 24px rgba(255, 230, 0, 0.75);
      animation: hint-glow 0.6s ease-in-out infinite alternate;
    }

    .banner-hint-main {
      font-size: clamp(30px, 5.5vw, 56px);
      font-weight: bold;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 0 18px #ff8800;
      letter-spacing: 3px;
      white-space: nowrap;
      animation: arcade-pulse 0.4s ease-in-out infinite alternate;
    }

    .banner-hint-sub {
      font-size: clamp(18px, 3vw, 30px);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    @keyframes hint-glow {
      0% { box-shadow: 0 0 0 3px #000, 0 0 12px rgba(255, 230, 0, 0.5); }
      100% { box-shadow: 0 0 0 3px #000, 0 0 32px rgba(255, 230, 0, 1); }
    }

    @keyframes arcade-pulse {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.06); }
    }

    .judgment-label { animation: judgment-slam 0.15s ease-out; }

    .judgment-score { color: #ffe600; margin-top: 6px; }

    /* 大惨事の後に切り替えて出す「もう一度挑戦」(判定文字と同じ位置・同じ勢いで) */
    .judgment-retry { color: #00f0ff; animation: judgment-slam 0.15s ease-out; }

    @keyframes judgment-slam {
      0% { transform: scale(1.6); opacity: 0.5; }
      100% { transform: scale(1.0); opacity: 1.0; }
    }

    /* Title Screen Overlay (旧オーバーレイは非表示にして共通ArcadeTitleScreenを使用) */
    #title-overlay {
      display: none !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
    }

    .title-logo {
      font-size: clamp(32px, 8vw, 84px);
      color: #ffe600;
      text-shadow:
        5px 5px 0 #000000,
        -5px -5px 0 #000000,
        5px -5px 0 #000000,
        -5px 5px 0 #000000,
        0 6px 0 #ff1a1a,
        0 10px 0 #000000;
      letter-spacing: 8px;
      margin-bottom: 44px;
      text-align: center;
    }

    /* Solid Sharp Arcade Buttons */
    .arcade-action-btn {
      appearance: none;
      border: 4px solid #ffffff;
      border-radius: 0px;
      background: #ff1a1a;
      color: #ffffff;
      font-family: inherit;
      font-weight: 900;
      font-size: 38px;
      padding: 14px 64px;
      cursor: pointer;
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      text-shadow: 3px 3px 0 #000;
      outline: none;
      pointer-events: auto;
    }

    .title-prompt-text {
      margin-top: 18px;
      font-size: 26px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      letter-spacing: 4px;
    }

    .arcade-action-btn:hover {
      background: #ffe600;
      color: #000000;
      border-color: #ffffff;
      text-shadow: none;
    }

    .arcade-action-btn:active {
      transform: scale(0.96);
    }

    /* 1-second interval blink */
    .blink-1s {
      animation: arcade-blink 1s steps(2, start) infinite;
    }

    @keyframes arcade-blink {
      to { opacity: 0.5; }
    }

    /* Attract Mode: DEMO overlays */
    #demo-banner {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 44px;
      color: #ff1a1a;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 8px;
      display: none;
    }



    #demo-prompt {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 36px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 6px;
      display: none;
      white-space: nowrap;
    }

    /* Attract Mode: Ranking Screen Overlay */
    #ranking-overlay {
      display: none !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .ranking-heading {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 8px;
      margin-bottom: 28px;
    }

    .ranking-table {
      border-collapse: collapse;
      margin-bottom: 36px;
      font-size: 30px;
      min-width: 580px;
    }

    .ranking-table th {
      padding: 8px 20px;
      border-bottom: 3px solid #ffffff;
      color: #888888;
      font-size: 22px;
      text-align: left;
    }

    .ranking-table td {
      padding: 10px 20px;
      border-bottom: 1px solid #222222;
      text-shadow: 2px 2px 0 #000;
    }

    .rank-gold { color: #ffd700; font-weight: 900; }
    .rank-silver { color: #e0e0e0; font-weight: 900; }
    .rank-bronze { color: #cd7f32; font-weight: 900; }
    .rank-normal { color: #ffffff; }

    .ranking-prompt {
      font-size: 32px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 4px;
    }

    /* Overall Result Screen Overlay */
    #result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      overflow-y: auto;
      padding: 12px 0;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.9);
    }

    /* リザルト: 総合評価を主役にして、偏差値と種目ごとの成績は小さく添える */
    .result-heading {
      font-size: clamp(14px, 3vh, 24px);
      color: #aaaaaa;
      letter-spacing: 8px;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: clamp(6px, 2vh, 18px);
    }

    #rank-val {
      font-size: min(100px, 9.5vw);   /* 判定表示・見出しと同じ大きさ */
      font-weight: 900;
      letter-spacing: 4px;
      white-space: nowrap;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      margin-bottom: clamp(4px, 1.5vh, 14px);
    }

    .result-deviation {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: clamp(14px, 4vh, 40px);
      text-shadow: 2px 2px 0 #000;
    }
    .result-deviation .summary-label { font-size: clamp(13px, 2.6vh, 22px); color: #aaaaaa; }
    #deviation-val { font-size: clamp(22px, 5vh, 44px); font-weight: 900; color: #ffe600; }

    #result-stages {
      border-collapse: collapse;
      margin-bottom: clamp(14px, 4vh, 40px);
      max-width: 96vw;
      font-size: clamp(12px, 2.4vh, 20px);
      font-weight: 900;
      white-space: nowrap;
      text-shadow: 1px 1px 0 #000;
    }
    #result-stages th {
      padding: 4px clamp(10px, 2vw, 28px);
      font-size: 0.7em;
      font-weight: 700;
      color: #aaaaaa;
      letter-spacing: 2px;
      text-align: left;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    }
    #result-stages td {
      padding: 4px clamp(10px, 2vw, 28px);
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    #result-stages td.title { color: #cccccc; }
    #result-stages td.pct { text-align: right; }

    @media (max-width: 768px) {
      #hud-top-bar { padding: 12px 14px; }
      .judgment-label, .judgment-retry, .judgment-score, .intro-headline, #rank-val { font-size: 64px; }
    }

    /* 日本語の文字を太めのゴシックにそろえる */
    .agc-root, .agc-label, .ats-tagline, .ap-root, .ap-root *, .msel, .msel * {
      font-family: 'Hiragino Kaku Gothic StdN', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif !important;
    }
    .agc-label, .ats-tagline { font-weight: 800 !important; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="scanlines"></div>
  <div id="danger-vignette"></div>
  <div id="danger-flash"></div>
  <div id="fade-overlay"></div>

  <!-- Container-less HUD (Direct Overlays) -->
  <div id="hud-overlay" style="display: none;">
    <div id="hud-top-bar">
      <div class="hud-block">
        <div id="hud-round" class="hud-label">1/4</div>
      </div>
      <div class="hud-block hud-block-right">
        <div id="hud-sub-info" class="hud-text"></div>
      </div>
    </div>

    <div id="hud-action-guide"></div>
  </div>


  <!-- Center Flashing Staging Messages -->
  <div id="center-banner"></div>

  <!-- Attract DEMO Mode Overlays -->
  <div id="demo-banner" class="blink-1s">-- デモ中 DEMO --</div>
  <div id="demo-prompt" class="blink-1s">ボタンヲ押シテスタート</div>

  <!-- Title Screen -->
  <div id="title-overlay">
    <div class="title-logo">極限ギリギリ選手権</div>
    <button id="btn-start" class="arcade-action-btn blink-1s">スタート</button>
    <div class="title-prompt-text blink-1s">ボタンヲ押セ / PRESS ANY BUTTON</div>
  </div>

  <!-- Attract Ranking Screen (Top 3) -->
  <div id="ranking-overlay">
    <div class="ranking-heading">最高度胸記録</div>
    <table class="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>度胸偏差値</th>
          <th>称号</th>
        </tr>
      </thead>
      <tbody id="ranking-tbody"></tbody>
    </table>
    <div class="ranking-prompt blink-1s">ボタンヲ押シテスタート</div>
  </div>

  <!-- Overall Result Screen -->
  <div id="result-overlay">
    <div class="result-heading">総合評価</div>
    <div id="rank-val">--</div>
    <div class="result-deviation">
      <div class="summary-label">度胸偏差値</div>
      <div id="deviation-val">0.0</div>
    </div>
    <table id="result-stages">
      <thead><tr><th>種目</th><th>判定</th><th>スコア</th></tr></thead>
      <tbody id="result-stages-body"></tbody>
    </table>
    <div id="result-menu">
      <button id="btn-retry" class="arcade-action-btn" tabindex="-1">再挑戦</button>
      <button id="btn-result-title" class="arcade-action-btn" tabindex="-1">タイトルに戻る</button>
      <button id="btn-result-exit" class="arcade-action-btn" tabindex="-1">ゲームを終了</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
