<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極限ギリギリ選手権 - EXTREME GIRI-GIRI ARCADE</title>
  <style>
    /* 1990-2000s Arcade Style: High Contrast, Sharp Edges, Impact Typography */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: Impact, "Arial Black", "Hiragino Kaku Gothic StdN", sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* CRT Scanline Overlay */
    #scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* Black Fade Overlay for direct stage transitions */
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      opacity: 0;
      transition: opacity 0.3s linear;
      z-index: 50;
      pointer-events: none;
    }

    /* Container-less HUD: Direct typography over 3D screen */
    .hud-text {
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow:
        3px 3px 0 #000,
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        0 4px 0 #000,
        4px 0 0 #000;
      line-height: 1.15;
    }

    /* Top HUD bar: flex row so left/right blocks never overlap, each side
       claims at most 46% width and scales down with clamp() on narrow screens */
    #hud-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 20px;
      gap: 12px;
      pointer-events: none;
    }

    .hud-block {
      display: flex;
      flex-direction: column;
      max-width: 46%;
      min-width: 0;
    }

    .hud-block-right {
      align-items: flex-end;
      text-align: right;
    }

    .hud-label {
      font-size: clamp(12px, 2vw, 18px);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    #hud-round { color: #ffe600; }
    #hud-time-label { color: #00ff66; }

    #hud-stage {
      color: #ffe600;
      font-size: clamp(16px, 4vw, 34px);
      overflow-wrap: break-word;
    }

    #hud-time {
      color: #00ff66;
      font-size: clamp(16px, 4vw, 34px);
    }

    #hud-sub-info {
      color: #00e5ff;
      font-size: clamp(12px, 2.4vw, 22px);
      display: none;
      margin-top: 2px;
    }

    /* Danger Vignette: Screen-edge red pulse when approaching limit */
    #danger-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%,
        rgba(255, 26, 26, 0) 65%,
        rgba(255, 26, 26, 0.9) 100%
      );
    }

    /* Critical flash overlay */
    #danger-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9;
      pointer-events: none;
      background: rgba(255, 26, 26, 0.18);
      opacity: 0;
    }

    /* Bottom-Right: Arcade Input Monitor */
    #arcade-inputs {
      position: absolute;
      bottom: 28px;
      right: 32px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stick-box {
      width: 44px;
      height: 44px;
      border: 3px solid #ffffff;
      background: #000000;
      position: relative;
    }

    #stick-dot {
      width: 16px;
      height: 16px;
      background: #ffe600;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.06s ease-out;
    }

    .arcade-btn {
      width: 40px;
      height: 40px;
      border: 3px solid #ffffff;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    .arcade-btn.active {
      background: #ff1a1a;
      border-color: #ffe600;
      color: #000000;
    }

    /* Persistent Bottom-Center Action Guide: kept off the top bar so it
       never competes for space with the stage/round and timer blocks */
    #hud-action-guide {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: clamp(13px, 2.4vw, 24px);
      color: #ffe600;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffe600;
      padding: 4px 16px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Center Staging Flash Banner */
    #center-banner {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      width: 100%;
    }

    .banner-title {
      font-size: 42px;
      color: #00ff66;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .banner-mission {
      font-size: 46px;
      color: #ffffff;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .banner-action {
      font-size: 58px;
      color: #ffe600;
      text-shadow: 5px 5px 0 #000, -5px -5px 0 #000, 5px -5px 0 #000, -5px 5px 0 #000;
      letter-spacing: 6px;
    }

    .pulse-text {
      animation: arcade-pulse 0.25s infinite alternate;
    }

    @keyframes arcade-pulse {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.06); }
    }

    .judgment-success {
      font-size: 96px;
      color: #00ff66;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      letter-spacing: 8px;
      animation: judgment-slam 0.15s ease-out;
    }

    .judgment-fail {
      font-size: 100px;
      color: #ff1a1a;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      letter-spacing: 10px;
      animation: judgment-slam 0.15s ease-out;
    }

    .judgment-score {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      margin-top: 6px;
    }

    @keyframes judgment-slam {
      0% { transform: scale(1.6); opacity: 0.5; }
      100% { transform: scale(1.0); opacity: 1.0; }
    }

    /* Title Screen Overlay (Transparent over 3D showcase) */
    #title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
    }

    .title-logo {
      font-size: clamp(32px, 8vw, 84px);
      color: #ffe600;
      text-shadow:
        5px 5px 0 #000000,
        -5px -5px 0 #000000,
        5px -5px 0 #000000,
        -5px 5px 0 #000000,
        0 6px 0 #ff1a1a,
        0 10px 0 #000000;
      letter-spacing: 8px;
      margin-bottom: 44px;
      text-align: center;
    }

    /* Solid Sharp Arcade Buttons */
    .arcade-action-btn {
      appearance: none;
      border: 4px solid #ffffff;
      border-radius: 0px;
      background: #ff1a1a;
      color: #ffffff;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 38px;
      padding: 14px 64px;
      cursor: pointer;
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      text-shadow: 3px 3px 0 #000;
      outline: none;
      pointer-events: auto;
    }

    .title-prompt-text {
      margin-top: 18px;
      font-size: 26px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      letter-spacing: 4px;
    }

    .arcade-action-btn:hover {
      background: #ffe600;
      color: #000000;
      border-color: #ffffff;
      text-shadow: none;
    }

    .arcade-action-btn:active {
      transform: scale(0.96);
    }

    /* 1-second interval blink */
    .blink-1s {
      animation: arcade-blink 1s steps(2, start) infinite;
    }

    @keyframes arcade-blink {
      to { opacity: 0.5; }
    }

    /* Attract Mode: DEMO overlays */
    #demo-banner {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 44px;
      color: #ff1a1a;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 8px;
      display: none;
    }

    /* ホーム誘導ガイド（画面下中央、常時表示・控えめ・クリックでも戻れる） */
    #home-guide {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1px;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.3);
      z-index: 70;
      user-select: none;
      transition: color 0.15s;
    }

    #home-guide:hover {
      color: rgba(255, 255, 255, 0.75);
    }

    #demo-prompt {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 36px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 6px;
      display: none;
      white-space: nowrap;
    }

    /* Attract Mode: Ranking Screen Overlay */
    #ranking-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .ranking-heading {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 8px;
      margin-bottom: 28px;
    }

    .ranking-table {
      border-collapse: collapse;
      margin-bottom: 36px;
      font-size: 30px;
      min-width: 580px;
    }

    .ranking-table th {
      padding: 8px 20px;
      border-bottom: 3px solid #ffffff;
      color: #888888;
      font-size: 22px;
      text-align: left;
    }

    .ranking-table td {
      padding: 10px 20px;
      border-bottom: 1px solid #222222;
      text-shadow: 2px 2px 0 #000;
    }

    .rank-gold { color: #ffd700; font-weight: 900; }
    .rank-silver { color: #e0e0e0; font-weight: 900; }
    .rank-bronze { color: #cd7f32; font-weight: 900; }
    .rank-normal { color: #ffffff; }

    .ranking-prompt {
      font-size: 32px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 4px;
    }

    /* Overall Result Screen Overlay */
    #result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
    }

    .result-heading {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 8px;
      margin-bottom: 24px;
    }

    .result-table {
      border-collapse: collapse;
      margin-bottom: 28px;
      font-size: 26px;
      border: 3px solid #ffffff;
      background: #000000;
      min-width: 520px;
    }

    .result-table td {
      padding: 8px 18px;
      border-bottom: 2px solid #333333;
      text-shadow: 2px 2px 0 #000;
    }

    .result-summary {
      display: flex;
      gap: 40px;
      margin-bottom: 36px;
      align-items: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .summary-label {
      font-size: 24px;
      color: #aaaaaa;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 4px;
    }

    .summary-val {
      font-size: 54px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
    }

    @media (max-width: 768px) {
      #hud-top-bar { padding: 12px 14px; }
      #arcade-inputs { bottom: 16px; right: 16px; }
      .judgment-success, .judgment-fail { font-size: 64px; }
      .result-table { min-width: 320px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="scanlines"></div>
  <div id="danger-vignette"></div>
  <div id="danger-flash"></div>
  <div id="fade-overlay"></div>

  <!-- Container-less HUD (Direct Overlays) -->
  <div id="hud-overlay" style="display: none;">
    <div id="hud-top-bar">
      <div class="hud-block">
        <div id="hud-round" class="hud-label">1/4</div>
        <div id="hud-stage" class="hud-text">ドリンクバー</div>
      </div>
      <div class="hud-block hud-block-right">
        <div id="hud-time-label" class="hud-label">残り時間</div>
        <div id="hud-time" class="hud-text">12.0</div>
        <div id="hud-sub-info" class="hud-text"></div>
      </div>
    </div>
    <div id="hud-action-guide">操作</div>

    <div id="arcade-inputs">
      <div class="stick-box">
        <div id="stick-dot"></div>
      </div>
      <div id="btn0-indicator" class="arcade-btn" style="min-width: 48px; font-size: 16px;">ENT</div>
      <div id="btn1-indicator" class="arcade-btn" style="min-width: 40px; font-size: 16px;">S/↓</div>
    </div>
  </div>

  <!-- ホーム誘導ガイド（HUD状態に関わらず常時表示・クリックでも遷移可能） -->
  <a id="home-guide" href="../../">ESC / SELECT長押し : ホームへ戻る</a>

  <!-- Center Flashing Staging Messages -->
  <div id="center-banner"></div>

  <!-- Attract DEMO Mode Overlays -->
  <div id="demo-banner" class="blink-1s">-- デモ中 DEMO --</div>
  <div id="demo-prompt" class="blink-1s">ボタンヲ押シテ開始</div>

  <!-- Title Screen -->
  <div id="title-overlay">
    <div class="title-logo">極限ギリギリ選手権</div>
    <button id="btn-start" class="arcade-action-btn blink-1s">開始</button>
    <div class="title-prompt-text blink-1s">ボタンヲ押セ / PRESS ANY BUTTON</div>
  </div>

  <!-- Attract Ranking Screen (Top 5) -->
  <div id="ranking-overlay">
    <div class="ranking-heading">最高度胸記録</div>
    <table class="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>度胸偏差値</th>
          <th>称号</th>
        </tr>
      </thead>
      <tbody id="ranking-tbody"></tbody>
    </table>
    <div class="ranking-prompt blink-1s">ボタンヲ押シテ開始</div>
  </div>

  <!-- Overall Result Screen -->
  <div id="result-overlay">
    <div class="result-heading">総合判定</div>
    <table class="result-table">
      <tbody id="result-tbody"></tbody>
    </table>
    <div class="result-summary">
      <div class="summary-item">
        <div class="summary-label">度胸偏差値</div>
        <div id="deviation-val" class="summary-val">0.0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">総合評価</div>
        <div id="rank-val" class="summary-val">--</div>
      </div>
    </div>
    <button id="btn-retry" class="arcade-action-btn">再挑戦</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
