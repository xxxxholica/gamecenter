<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極限ギリギリ選手権｜EXTREME GIRI-GIRI ARCADE</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" href="./favicon.ico" />
  <style>
    /* 1990-2000s Arcade Style: High Contrast, Sharp Edges, Impact Typography */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: Impact, "Arial Black", "Hiragino Kaku Gothic StdN", sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* CRT Scanline Overlay */
    #scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* Black Fade Overlay for direct stage transitions */
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      opacity: 0;
      transition: opacity 0.3s linear;
      z-index: 50;
      pointer-events: none;
    }

    /* Container-less HUD: Direct typography over 3D screen */
    .hud-text {
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow:
        3px 3px 0 #000,
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        0 4px 0 #000,
        4px 0 0 #000;
      line-height: 1.15;
    }

    /* Top HUD bar: flex row so left/right blocks never overlap, each side
       claims at most 46% width and scales down with clamp() on narrow screens */
    #hud-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 20px;
      gap: 12px;
      pointer-events: none;
    }

    .hud-block {
      display: flex;
      flex-direction: column;
      max-width: 46%;
      min-width: 0;
    }

    .hud-block-right {
      align-items: flex-end;
      text-align: right;
    }

    .hud-label {
      font-size: clamp(12px, 2vw, 18px);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    #hud-round { color: #ffe600; }
    #hud-time-label { color: #00ff66; }

    #hud-stage {
      color: #ffe600;
      font-size: clamp(16px, 4vw, 34px);
      overflow-wrap: break-word;
    }

    #hud-time {
      color: #00ff66;
      font-size: clamp(16px, 4vw, 34px);
    }

    #hud-sub-info {
      color: #00e5ff;
      font-size: clamp(12px, 2.4vw, 22px);
      display: none;
      margin-top: 2px;
    }

    /* Danger Vignette: Screen-edge red pulse when approaching limit */
    #danger-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%,
        rgba(255, 26, 26, 0) 65%,
        rgba(255, 26, 26, 0.9) 100%
      );
    }

    /* Critical flash overlay */
    #danger-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9;
      pointer-events: none;
      background: rgba(255, 26, 26, 0.18);
      opacity: 0;
    }

    /* Bottom-Right: Arcade Input Monitor */
    #arcade-inputs {
      position: absolute;
      bottom: 28px;
      right: 32px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stick-box {
      width: 44px;
      height: 44px;
      border: 3px solid #ffffff;
      background: #000000;
      position: relative;
    }

    #stick-dot {
      width: 16px;
      height: 16px;
      background: #ffe600;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.06s ease-out;
    }

    .arcade-btn {
      width: 40px;
      height: 40px;
      border: 3px solid #ffffff;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    .arcade-btn.active {
      background: #ff1a1a;
      border-color: #ffe600;
      color: #000000;
    }

    /* 下部中央に常時表示する「レバー上だけ」の注意書き */
    #hud-action-guide {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: clamp(13px, 2vw, 16px);
      font-weight: bold;
      color: #ffe600;
      background: rgba(6, 12, 10, 0.94);
      border: 2px solid #ffe600;
      border-radius: 999px;
      padding: 6px 18px;
      text-shadow: 2px 2px 0 #000;
      white-space: nowrap;
    }

    /* 種目の説明カード */
    #brief-overlay {
      position: absolute;
      inset: 0;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vw, 16px);
      background: rgba(0, 0, 0, 0.68);
      cursor: pointer;
    }

    .brief-card {
      width: fit-content;
      max-width: 96vw;
      padding: clamp(16px, 3vw, 32px) clamp(18px, 4vw, 44px);
      border: 4px solid #00ff66;
      background: rgba(6, 12, 10, 0.94);
      box-shadow: 0 0 40px rgba(0, 255, 102, 0.35);
      text-align: left;
    }

    .brief-stage {
      font-size: clamp(14px, 2.6vw, 22px);
      color: #00ff66;
      letter-spacing: 3px;
    }

    /* 説明文は1行に収める(折り返さない) */
    .brief-row {
      margin-top: clamp(10px, 2vw, 18px);
      font-size: clamp(16px, 3.4vw, 34px);
      color: #f1f1f1;
      line-height: 1.35;
      text-shadow: 3px 3px 0 #000;
      white-space: nowrap;
    }

    .brief-key {
      display: inline-block;
      padding: 0 14px;
      border: 3px solid #ffe600;
      color: #ffe600;
      font-weight: bold;
      white-space: nowrap;
    }

    .brief-mark {
      display: inline-block;
      width: 1.6em;
      font-weight: bold;
    }

    .brief-row.ok .brief-mark { color: #00ff66; }
    .brief-row.ng { color: #ff9a9a; }
    .brief-row.ng .brief-mark { color: #ff1a1a; }

    .brief-start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: clamp(16px, 2.5vw, 24px) auto 0;
      padding: clamp(10px, 1.8vw, 16px) clamp(24px, 4vw, 40px);
      font-family: inherit;
      font-size: clamp(20px, 3.2vw, 28px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      background: #ff1a1a;
      border: 4px solid #ffffff;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      box-shadow: 0 6px 0 #000, 0 0 24px rgba(255, 26, 26, 0.7);
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
      text-shadow: 2px 2px 0 #000;
      width: fit-content;
    }

    .brief-start-btn:hover {
      background: #ffe600;
      color: #000000;
      text-shadow: none;
      box-shadow: 0 6px 0 #000, 0 0 30px rgba(255, 230, 0, 0.8);
    }

    .brief-start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000;
    }

    .brief-start-btn .agc-inline {
      margin-right: 4px;
    }

    .brief-start-btn .agc-btn {
      width: 28px;
      height: 28px;
      font-size: 14px;
      border-radius: 14px !important;
      border-width: 2px;
    }

    /* Center Staging Flash Banner */
    #center-banner {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      width: 100%;
    }

    .banner-title {
      font-size: 42px;
      color: #00ff66;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .banner-mission {
      font-size: 46px;
      color: #ffffff;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .banner-action {
      font-size: 58px;
      color: #ffe600;
      text-shadow: 5px 5px 0 #000, -5px -5px 0 #000, 5px -5px 0 #000, -5px 5px 0 #000;
      letter-spacing: 6px;
    }

    .pulse-text {
      animation: arcade-pulse 0.25s infinite alternate;
    }

    /* プレイ中に画面中央へ出し続けるヒント。1行目(主)を大きく、2行目以降(補足)を小さく、枠付きで強調する */
    .banner-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 1vw, 10px);
      padding: clamp(12px, 2vw, 20px) clamp(20px, 4vw, 44px);
      background: rgba(0, 0, 0, 0.72);
      border: 4px solid #ffe600;
      border-radius: 12px;
      box-shadow: 0 0 0 3px #000, 0 0 24px rgba(255, 230, 0, 0.75);
      animation: hint-glow 0.6s ease-in-out infinite alternate;
    }

    .banner-hint-main {
      font-size: clamp(30px, 5.5vw, 56px);
      font-weight: bold;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 0 18px #ff8800;
      letter-spacing: 3px;
      white-space: nowrap;
      animation: arcade-pulse 0.4s ease-in-out infinite alternate;
    }

    .banner-hint-sub {
      font-size: clamp(18px, 3vw, 30px);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    @keyframes hint-glow {
      0% { box-shadow: 0 0 0 3px #000, 0 0 12px rgba(255, 230, 0, 0.5); }
      100% { box-shadow: 0 0 0 3px #000, 0 0 32px rgba(255, 230, 0, 1); }
    }

    @keyframes arcade-pulse {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.06); }
    }

    .judgment-success {
      font-size: 96px;
      color: #00ff66;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      letter-spacing: 8px;
      animation: judgment-slam 0.15s ease-out;
    }

    .judgment-fail {
      font-size: min(100px, 9.5vw); /* 「もう一回挑戦できる」と同じ大きさ */
      color: #ff1a1a;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      letter-spacing: 10px;
      animation: judgment-slam 0.15s ease-out;
    }

    .judgment-score {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      margin-top: 6px;
    }

    /* 大惨事の後に切り替えて出す「もう一回挑戦できる」(判定文字と同じ位置・同じ勢いで) */
    .judgment-retry {
      font-size: min(100px, 9.5vw); /* 「大惨事」と同じ大きさ */
      color: #00f0ff;
      text-shadow: 6px 6px 0 #000, -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000;
      letter-spacing: 4px;
      white-space: nowrap;
      animation: judgment-slam 0.15s ease-out;
    }

    @keyframes judgment-slam {
      0% { transform: scale(1.6); opacity: 0.5; }
      100% { transform: scale(1.0); opacity: 1.0; }
    }

    /* Title Screen Overlay (旧オーバーレイは非表示にして共通ArcadeTitleScreenを使用) */
    #title-overlay {
      display: none !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
    }

    .title-logo {
      font-size: clamp(32px, 8vw, 84px);
      color: #ffe600;
      text-shadow:
        5px 5px 0 #000000,
        -5px -5px 0 #000000,
        5px -5px 0 #000000,
        -5px 5px 0 #000000,
        0 6px 0 #ff1a1a,
        0 10px 0 #000000;
      letter-spacing: 8px;
      margin-bottom: 44px;
      text-align: center;
    }

    /* Solid Sharp Arcade Buttons */
    .arcade-action-btn {
      appearance: none;
      border: 4px solid #ffffff;
      border-radius: 0px;
      background: #ff1a1a;
      color: #ffffff;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 38px;
      padding: 14px 64px;
      cursor: pointer;
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      text-shadow: 3px 3px 0 #000;
      outline: none;
      pointer-events: auto;
    }

    .title-prompt-text {
      margin-top: 18px;
      font-size: 26px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      letter-spacing: 4px;
    }

    .arcade-action-btn:hover {
      background: #ffe600;
      color: #000000;
      border-color: #ffffff;
      text-shadow: none;
    }

    .arcade-action-btn:active {
      transform: scale(0.96);
    }

    /* 1-second interval blink */
    .blink-1s {
      animation: arcade-blink 1s steps(2, start) infinite;
    }

    @keyframes arcade-blink {
      to { opacity: 0.5; }
    }

    /* Attract Mode: DEMO overlays */
    #demo-banner {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 44px;
      color: #ff1a1a;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 8px;
      display: none;
    }



    #demo-prompt {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 36px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 6px;
      display: none;
      white-space: nowrap;
    }

    /* Attract Mode: Ranking Screen Overlay */
    #ranking-overlay {
      display: none !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .ranking-heading {
      font-size: 64px;
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 8px;
      margin-bottom: 28px;
    }

    .ranking-table {
      border-collapse: collapse;
      margin-bottom: 36px;
      font-size: 30px;
      min-width: 580px;
    }

    .ranking-table th {
      padding: 8px 20px;
      border-bottom: 3px solid #ffffff;
      color: #888888;
      font-size: 22px;
      text-align: left;
    }

    .ranking-table td {
      padding: 10px 20px;
      border-bottom: 1px solid #222222;
      text-shadow: 2px 2px 0 #000;
    }

    .rank-gold { color: #ffd700; font-weight: 900; }
    .rank-silver { color: #e0e0e0; font-weight: 900; }
    .rank-bronze { color: #cd7f32; font-weight: 900; }
    .rank-normal { color: #ffffff; }

    .ranking-prompt {
      font-size: 32px;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 4px;
    }

    /* Overall Result Screen Overlay */
    #result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      overflow-y: auto;
      padding: 12px 0;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.9);
    }

    .result-heading {
      font-size: clamp(28px, 8vh, 64px);
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
      letter-spacing: 8px;
      margin-bottom: clamp(8px, 2.5vh, 24px);
    }

    .result-table {
      border-collapse: collapse;
      margin-bottom: clamp(8px, 2.5vh, 28px);
      font-size: clamp(14px, 3vh, 26px);
      border: 3px solid #ffffff;
      background: #000000;
      min-width: min(520px, 92vw);
    }

    .result-table td {
      padding: clamp(3px, 0.8vh, 8px) clamp(8px, 2vw, 18px);
      border-bottom: 2px solid #333333;
      text-shadow: 2px 2px 0 #000;
    }

    .result-summary {
      display: flex;
      gap: clamp(16px, 5vw, 40px);
      margin-bottom: clamp(8px, 2.5vh, 24px);
      align-items: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .summary-label {
      font-size: clamp(13px, 2.8vh, 24px);
      color: #aaaaaa;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 4px;
    }

    .summary-val {
      font-size: clamp(26px, 6.5vh, 54px);
      color: #ffe600;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000;
    }

    @media (max-width: 768px) {
      #hud-top-bar { padding: 12px 14px; }
      #arcade-inputs { bottom: 16px; right: 16px; }
      .judgment-success, .judgment-fail, .judgment-retry { font-size: 64px; }
      .result-table { min-width: 320px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="scanlines"></div>
  <div id="danger-vignette"></div>
  <div id="danger-flash"></div>
  <div id="fade-overlay"></div>

  <!-- Container-less HUD (Direct Overlays) -->
  <div id="hud-overlay" style="display: none;">
    <div id="hud-top-bar">
      <div class="hud-block">
        <div id="hud-round" class="hud-label">1/4</div>
        <div id="hud-stage" class="hud-text">ドリンクバー</div>
      </div>
      <div class="hud-block hud-block-right">
        <div id="hud-time-label" class="hud-label">残り時間</div>
        <div id="hud-time" class="hud-text">12.0</div>
        <div id="hud-sub-info" class="hud-text"></div>
      </div>
    </div>
    <div id="hud-action-guide">このゲームで使うのはレバー上だけ！</div>

    <div id="arcade-inputs">
      <div class="stick-box" title="レバー">
        <div id="stick-dot"></div>
      </div>
      <div id="btn0-indicator" class="arcade-btn" style="min-width: 44px; font-size: 18px; font-weight: 900; display: none;">0</div>
      <div id="btn1-indicator" class="arcade-btn" style="min-width: 44px; font-size: 18px; font-weight: 900; display: none;">1</div>
    </div>
  </div>


  <!-- Center Flashing Staging Messages -->
  <div id="center-banner"></div>

  <!-- 種目の説明カード(開始前にボタン待ち) -->
  <div id="brief-overlay"></div>

  <!-- Attract DEMO Mode Overlays -->
  <div id="demo-banner" class="blink-1s">-- デモ中 DEMO --</div>
  <div id="demo-prompt" class="blink-1s">ボタンヲ押シテ開始</div>

  <!-- Title Screen -->
  <div id="title-overlay">
    <div class="title-logo">極限ギリギリ選手権</div>
    <button id="btn-start" class="arcade-action-btn blink-1s">開始</button>
    <div class="title-prompt-text blink-1s">ボタンヲ押セ / PRESS ANY BUTTON</div>
  </div>

  <!-- Attract Ranking Screen (Top 3) -->
  <div id="ranking-overlay">
    <div class="ranking-heading">最高度胸記録</div>
    <table class="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>度胸偏差値</th>
          <th>称号</th>
        </tr>
      </thead>
      <tbody id="ranking-tbody"></tbody>
    </table>
    <div class="ranking-prompt blink-1s">ボタンヲ押シテ開始</div>
  </div>

  <!-- Overall Result Screen -->
  <div id="result-overlay">
    <div class="result-heading">総合判定</div>
