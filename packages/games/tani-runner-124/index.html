<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>単位増殖ラン｜TANI RUNNER 124</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D Canvas -->
  <div id="game-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- CRT Scanline Overlay -->
  <div class="crt-overlay"></div>

  <!-- In-Game Minimal HUD -->
  <div id="hud" class="hud-container" style="display: none;">
    <!-- Top HUD Bar -->
    <div class="hud-top-bar">
      <!-- 画面隅: 「要件 124」 -->
      <div class="hud-corner-box">
        <span id="req-text" class="hud-corner-text">要件 124</span>
      </div>

      <!-- 画面中央上: 「単位」 ＋ 数字 -->
      <div class="hud-center-box" id="hud-credits-box">
        <span class="hud-center-label">単位</span>
        <span id="tani-counter" class="hud-center-num">4</span>
      </div>

      <!-- 右隅: 現在のステージ (小学校 など) -->
      <div class="hud-corner-box hud-stage-box">
        <span id="stage-text" class="hud-corner-text">小学校</span>
      </div>
    </div>

    <!-- ラウンド開始・ステージ突破バナー -->
    <div id="round-intro-banner" class="round-intro-banner hidden">
      <div id="round-intro-headline" class="intro-headline">小学校を卒業せよ</div>
      <div id="round-intro-sub" class="intro-sub hidden"></div>
    </div>

    <!-- 最後のジャンプ: ゲージの緑の帯でボタンを押すほど遠くへ飛ぶ -->
    <div id="launch-timing" class="launch-timing hidden">
      <div class="launch-timing-label">タイミングよくジャンプ</div>
      <div class="launch-timing-bar">
        <div id="launch-timing-zone" class="launch-timing-zone"></div>
        <div id="launch-timing-cursor" class="launch-timing-cursor"></div>
      </div>
      <div id="launch-timing-result" class="launch-timing-result"></div>
    </div>

    <!-- ボーナス測定中倍率HUD (画面中央上部) -->
    <div id="bonus-multiplier-hud" class="bonus-multiplier-hud hidden">
      <div id="bonus-current-mult" class="bonus-mult-text">×1.0</div>
      <div id="bonus-hint" class="bonus-hint"></div>
    </div>
  </div>

  <!-- Level Select Screen (開始後に遷移。中身は levelSelectScreen.ts が描画する) -->
  <div id="level-select-screen" class="overlay-screen level-select-screen hidden"></div>

  <!-- Fail Screen (留年) -->
  <div id="fail-screen" class="overlay-screen hidden">
    <div class="arcade-card result-card fail-card">
      <div class="result-stage">
        <div class="final-score-row">
          <span id="fail-score-display" class="final-score-text">0</span>
          <span class="final-score-unit">単位</span>
        </div>
        <div class="result-stamp fail">留年</div>
      </div>
      <div class="final-details">
        <span id="fail-level-display"></span>
      </div>
      <div class="result-menu">
        <button type="button" tabindex="-1" id="retry-fail-btn" class="arcade-btn retry-btn">再挑戦</button>
        <button type="button" tabindex="-1" id="title-fail-btn" class="level-change-btn">タイトルに戻る</button>
        <button type="button" tabindex="-1" id="exit-fail-btn" class="level-change-btn">ゲームを終了</button>
      </div>
    </div>
  </div>

  <!-- Clear Screen (卒業) -->
  <div id="success-screen" class="overlay-screen hidden">
    <div class="arcade-card result-card success-card">
      <div class="result-stage">
        <div class="final-score-row">
          <span id="final-score-display" class="final-score-text">0</span>
          <span class="final-score-unit">単位</span>
        </div>
        <div class="result-stamp">卒業</div>
      </div>
      <div class="final-details">
        <span id="final-level-display"></span>
        <span id="final-multiplier-display">倍率 ×1.0</span>
        <span id="final-ring-display">リング 0/3</span>
      </div>
      <div class="result-menu">
        <button type="button" tabindex="-1" id="retry-success-btn" class="arcade-btn success-btn">再挑戦</button>
        <button type="button" tabindex="-1" id="title-success-btn" class="level-change-btn">タイトルに戻る</button>
        <button type="button" tabindex="-1" id="exit-success-btn" class="level-change-btn">ゲームを終了</button>
      </div>
    </div>
  </div>


  <script type="module" src="/src/main.ts"></script>
</body>
</html>
