<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>グラグラタワー - TOWER STACK</title>
    <style>
      :root { --accent: #ffd166; }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; color: #fff;
        font-family: system-ui, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      /* ── プレイ中のHUD ── */
      #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
      .panel { position: absolute; padding: 12px 16px; background: rgba(8, 8, 14, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.14); border-left: 4px solid var(--accent);
        border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--accent); }
      .value { font-family: 'Impact', 'Arial Black', system-ui, sans-serif; font-size: 34px;
        font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: 0.02em; }
      .value small { font-size: 16px; margin-left: 4px; }
      #left { top: 14px; left: 14px; min-width: 180px; }
      #left .row + .row { margin-top: 10px; }
      #right { top: 14px; right: 14px; width: 180px; }
      #right .row + .row { margin-top: 12px; }

      #drops { display: flex; gap: 6px; margin-top: 5px; }
      #drops i { font-style: normal; font-size: 26px; line-height: 1; color: #ff4d6d; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
      #drops i::before { content: '♥'; }
      #drops i.lost { color: rgba(255, 255, 255, 0.22); text-shadow: none; }

      #next { display: grid; grid-template-columns: repeat(4, 20px); grid-template-rows: repeat(2, 20px); width: 86px; height: 42px; align-content: center; justify-content: start;
        gap: 2px; margin-top: 6px; }
      #next i { border-radius: 3px; }
      #next .next-special { grid-column: 1 / -1; grid-row: 1 / -1; align-self: center; font-size: 20px; font-weight: 900; color: #fff; white-space: nowrap; }

      #items { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; min-height: 96px; }
      .item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
        font-size: 14px; font-weight: 800; color: #111; opacity: 0.5; }
      .item:first-child { opacity: 1; outline: 2px solid #fff; }
      .item.glue { background: #7ddc6a; }
      .item.cement { background: #cfd6dd; }
      .item.shield { background: #7bdff2; }
      .item.heal { background: #ff8fa3; }
      .empty { font-size: 12px; opacity: 0.6; line-height: 1.5; }
      #status { font-size: 12px; font-weight: 700; line-height: 1.5; min-height: 18px; color: var(--accent); }

      #banner { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); padding: 10px 32px 12px;
        font-family: 'Impact', 'Arial Black', system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
        font-size: 30px; letter-spacing: 0.06em; white-space: nowrap; text-align: center;
        background: rgba(8, 8, 14, 0.88); border-top: 3px solid #e63946; border-bottom: 3px solid #e63946;
        color: #ff8a93; display: none; }
      #banner.good { border-color: #4fd6a0; color: #9af0cf; }
      #banner small { display: block; margin-top: 2px; font-family: system-ui, 'Hiragino Kaku Gothic ProN', sans-serif;
        font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #fff; }

      #match { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 22px; display: none; white-space: nowrap;
        font-size: 18px; font-weight: 800; letter-spacing: 0.06em; background: rgba(8, 8, 14, 0.82); border: 1px solid var(--accent);
        border-radius: 999px; font-variant-numeric: tabular-nums; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
      /* オンライン対戦: ステージを並べるので、左右のパネルを小さくする */
      /* オンライン対戦: ステージを画面いっぱいに並べるので、UI(状況・高さ・残機・NEXT・アイテム・ボタンガイド)を
         上部の1本のバーにまとめる。要素は main.ts の setOnlineLayout() がこのバーへ移す */
      #topbar { position: fixed; top: 10px; left: 0; right: 0; margin: 0 auto; width: max-content; display: none; align-items: stretch; gap: 8px;
        max-width: calc(100vw - 20px); pointer-events: none; z-index: 6; }
      body.online #topbar { display: flex; }
      #topbar > * { position: static !important; inset: auto !important; transform: none !important; margin: 0 !important; }
      #topbar > * { flex: none; }
      #topbar .label { white-space: nowrap; }
      #topbar #drops { flex-wrap: nowrap; }
      /* バー全体を1つの枠にし、中の項目は枠を外して区切り線で分ける */
      #topbar { background: rgba(8, 8, 14, 0.85); border: 1px solid rgba(255, 255, 255, 0.14); border-left: 4px solid var(--accent);
        border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); padding: 4px 6px; gap: 0; }
      #topbar > * { background: none !important; border: none !important; box-shadow: none !important; border-radius: 0 !important; }
      #topbar > * + * { border-left: 1px solid rgba(255, 255, 255, 0.16) !important; }
      #topbar .panel { padding: 6px 14px; }
      #topbar .value { font-size: 24px; }
      #topbar #match { display: flex !important; align-items: center; justify-content: center; text-align: center; white-space: normal;
        width: 170px; font-size: 14px; line-height: 1.4; border-radius: 10px; padding: 6px 12px; }
      #topbar #left { min-width: 0; display: flex; gap: 16px; align-items: center; }
      #topbar #left .row:first-child { display: none; }
      #topbar #left .row + .row, #topbar #right .row + .row { margin-top: 0; }
      #topbar #drops i { width: 20px; height: 20px; }
      #topbar #right { width: auto; display: flex; gap: 16px; align-items: center; }
      #topbar #next { margin-top: 2px; }
      #topbar #items { flex-direction: row; min-height: 0; margin-top: 2px; }
      #topbar .item { padding: 3px 7px; font-size: 13px; }
      #topbar .empty { max-width: 9em; }
      #topbar #status:empty { display: none; }
      #topbar #agc-guide { flex-direction: column; justify-content: center; gap: 4px; padding: 6px 14px; box-shadow: none; width: max-content; max-width: none; }
      /* レベルアップの演出(画面中央) */
      #speedup { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; white-space: nowrap;
        font-family: 'Impact', 'Arial Black', system-ui, sans-serif; font-size: clamp(48px, 11vh, 96px); font-style: italic; letter-spacing: 0.04em;
        color: #fff; -webkit-text-stroke: 3px #e63946; paint-order: stroke fill; text-shadow: 0 0 24px rgba(255, 120, 60, 0.85), 0 6px 0 #7a1020; }
      #speedup.show { animation: speedPop 1.4s ease-out forwards; }
      @keyframes speedPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) skewX(-12deg); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) skewX(-12deg); }
        28% { transform: translate(-50%, -50%) scale(1) skewX(-12deg); }
        75% { opacity: 1; transform: translate(-50%, -50%) scale(1) skewX(-12deg); }
        100% { opacity: 0; transform: translate(-30%, -50%) scale(1.05) skewX(-12deg); }
      }
      /* オンライン対戦のスタート前カウントダウン(画面中央) */
      #countdown { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none;
        font-family: 'Impact', 'Arial Black', system-ui, sans-serif; font-size: clamp(80px, 22vh, 180px); color: #ffd166;
        -webkit-text-stroke: 4px #1a1330; paint-order: stroke fill; text-shadow: 0 8px 0 #1a1330; }
      /* オンライン対戦: 左上(移動・回転)と右上(アイテム・ホーム)に分けたボタンガイド。左のパネルは名札と重複するので出さない */
      .agc-root.agc-top-right { top: 14px; bottom: auto; left: auto; right: 14px; }
      body.online #left { display: none; }
      /* ── リザルト ── */
      #result-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(5, 7, 18, 0.72); z-index: 100; }
      #result-modal.show { display: flex; }
      .result-content { width: min(92vw, 460px); padding: clamp(14px, 3vh, 28px) 24px; text-align: center;
        background: rgba(8, 8, 14, 0.94); border: 2px solid var(--accent);
        box-shadow: 0 0 34px rgba(255, 209, 102, 0.35); animation: resultPop 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
      @keyframes resultPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .result-badge { font-size: 12px; font-weight: 700; letter-spacing: 0.3em; color: var(--accent); }
      .result-title { font-family: 'Impact', 'Arial Black', system-ui, sans-serif; font-size: clamp(30px, 6vh, 46px);
        letter-spacing: 0.06em; margin-top: 4px; }
      .result-label { margin-top: clamp(6px, 1.6vh, 14px); font-size: 12px; font-weight: 700; letter-spacing: 0.24em; opacity: 0.7; }
      #result-score { font-family: 'Impact', 'Arial Black', system-ui, sans-serif; font-size: clamp(44px, 10vh, 76px);
        line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
      #result-detail { font-size: 15px; font-weight: 700; }
      #result-record { min-height: 22px; margin: 4px 0 clamp(8px, 2vh, 18px); font-size: 14px; font-weight: 700; opacity: 0.85; }
      #result-record.new { color: #7ddc6a; opacity: 1; }
      #result-ranking { margin: 0 auto clamp(8px, 2vh, 16px); width: min(100%, 340px); font-size: 14px; }
      .rank-head { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: var(--accent); margin-bottom: 4px; }
      .rank-row { display: flex; align-items: center; gap: 10px; padding: 3px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 700; font-variant-numeric: tabular-nums; }
      .rank-row .rank-no { width: 2.6em; text-align: left; }
      .rank-row.r1 .rank-no { color: #ffd700; }
      .rank-row.r2 .rank-no { color: #d0e0f0; }
      .rank-row.r3 .rank-no { color: #cd7f32; }
      .rank-row .rank-name { flex: 1; text-align: left; }
      .rank-row.empty { opacity: 0.45; justify-content: center; }
      .rank-row.empty .rank-name { text-align: left; }
      .rank-row.me { background: rgba(255, 209, 102, 0.22); outline: 1px solid var(--accent); }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="topbar"></div>
      <div id="left" class="panel">
        <div class="row"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
        <div class="row"><div class="label">いまの高さ</div><div class="value"><span id="height">0.0</span><small>m</small></div></div>
        <div class="row"><div class="label">残機</div><div id="drops"><i></i><i></i><i></i></div></div>
      </div>
      <div id="right" class="panel">
        <div class="row"><div class="label">NEXT</div><div id="next"></div></div>
        <div class="row"><div class="label">アイテム</div><div id="items"></div></div>
        <div class="row"><div id="status"></div></div>
      </div>
      <div id="match"></div>
      <div id="banner"></div>
      <div id="speedup"></div>
      <div id="countdown"></div>
    </div>

    <div id="result-modal">
      <div class="result-content">
        <div class="result-badge">◆ ブロックを3個落とした ◆</div>
        <h2 class="result-title">GAME OVER</h2>
        <div class="result-label">SCORE</div>
        <div id="result-score">0</div>
        <div id="result-detail"></div>
        <div id="result-record"></div>
        <div id="result-ranking"></div>
        <div id="result-menu">
          <button id="result-btn-retry">再挑戦</button>
          <button id="result-btn-title">タイトルに戻る</button>
          <button id="result-btn-exit">ゲームを終了</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
