<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミッドナイト・スカイウェイ｜MIDNIGHT SKYWAY: TIME ATTACK</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Canvas Container -->
      <div id="canvas-container"></div>

      <!-- Screen 1: Title Screen (Managed by ArcadeTitleScreen) -->
      <div id="screen-title" style="display: none;"></div>

      <!-- Screen 2: Car Select Screen -->
      <div id="screen-car-select" class="screen-overlay" style="display: none;"></div>

      <!-- Screen 3: Map Select Screen -->
      <div id="screen-map-select" class="screen-overlay" style="display: none;"></div>

      <!-- Mode select (before the machine select): offline / online. Only shown while the online battle is open -->
      <div id="screen-mode-select" class="screen-overlay" style="display: none;"></div>

      <!-- Screen 3a: Ghost Select Screen (top-3 runs of the course, from the server ranking) -->

      <!-- Online lobby (event use; reached only from the ?online title) -->
      <div id="screen-lobby" style="display: none;"></div>

      <!-- Stage Loading Screen -->
      <div id="screen-stage-loading" class="screen-overlay" style="display: none;"></div>

      <!-- Screen 4: Drive HUD & Race Overlays -->
      <div id="drive-hud-container" style="display: none;"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
